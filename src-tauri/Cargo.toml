[package]
name = "factory-printing"
version = "0.1.3"
description = "进发印刷工单客户端"
authors = ["guanxc"]
edition = "2021"

[lib]
name = "factory_printing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
